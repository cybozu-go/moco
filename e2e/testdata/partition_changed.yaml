apiVersion: moco.cybozu.com/v1beta2
kind: MySQLCluster
metadata:
  namespace: {{ .Namespace }}
  name: test
spec:
  replicas: 3
  podTemplate:
    spec:
      containers:
      - name: mysqld
        image: ghcr.io/cybozu-go/moco/mysql:{{ .MySQLVersion }}
        resources:
          requests:
            cpu: 2m
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
