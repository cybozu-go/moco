apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Namespace }}
  name: mycnf
data:
  innodb_log_file_size: "10M"
  # Reduce the memory of mysqld, because many instances run in parallel in e2e.
  # performance_schema is sized by max_connections and table_open_cache.
  innodb_buffer_pool_size: "32M"
  innodb_log_buffer_size: "4M"
  key_buffer_size: "1M"
  max_connections: "200"
  table_open_cache: "400"
  table_definition_cache: "400"
  performance_schema_accounts_size: "100"
  performance_schema_hosts_size: "100"
  performance_schema_users_size: "100"
  performance_schema_max_thread_instances: "200"
  performance_schema_digests_size: "1000"
  performance_schema_events_statements_history_long_size: "1000"
---
apiVersion: moco.cybozu.com/v1beta2
kind: MySQLCluster
metadata:
  namespace: {{ .Namespace }}
  name: test
spec:
  mysqlConfigMapName: mycnf
  replicas: {{ .Replicas }}
  replicationSourceSecretName: donor
  podTemplate:
    spec:
      containers:
      - name: mysqld
        image: ghcr.io/cybozu-go/moco/mysql:{{ .MySQLVersion }}
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
