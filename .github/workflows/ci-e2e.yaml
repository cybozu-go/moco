name: E2E CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  cache-version: 1

# CI tests with supported MySQL version.
jobs:
  dbtest:
    name: Integration tests with MySQL
    permissions:
      contents: read
      pull-requests: read # Required for tj-actions/changed-files
    strategy:
      matrix:
        mysql-version: ["8.0.28", "8.0.46", "8.4.4", "8.4.9", "8.4.10"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and output changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files_ignore: |
            **/*.md
            containers/**
      - uses: ./.github/actions/dbtest
        with:
          mysql-version: ${{ matrix.mysql-version }}
        if: steps.changed-files.outputs.any_changed == 'true'

  e2e:
    name: Supported Kubernetes versions End-to-End Tests
    permissions:
      contents: read
      pull-requests: read # Required for tj-actions/changed-files
    strategy:
      matrix:
        mysql-version: ["8.4.10"]
        k8s-version: ["1.33.7", "1.34.3", "1.35.4"]
    runs-on:
      group: moco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and output changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files_ignore: |
            **/*.md
            containers/**
      - uses: ./.github/actions/e2e
        with:
          k8s-version: ${{ matrix.k8s-version }}
          mysql-version: ${{ matrix.mysql-version }}
          name: k8s-version-e2e
        if: steps.changed-files.outputs.any_changed == 'true'

  e2e-mysql:
    name: Supported MySQL versions End-to-End Tests
    permissions:
      contents: read
      pull-requests: read # Required for tj-actions/changed-files
    strategy:
      matrix:
        mysql-version: ["8.0.28", "8.0.46", "8.4.4", "8.4.9", "8.4.10"]
        k8s-version: ["1.35.4"]
    runs-on:
      group: moco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and output changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files_ignore: |
            **/*.md
            containers/**
      - uses: ./.github/actions/e2e
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          k8s-version: ${{ matrix.k8s-version }}
          mysql-version: ${{ matrix.mysql-version }}
          name: mysql-version-e2e

  upgrade:
    name: Upgrade Test
    permissions:
      contents: read
      pull-requests: read # Required for tj-actions/changed-files
    runs-on:
      group: moco
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and output changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changed-files
        with:
          files_ignore: |
            **/*.md
            containers/**
      - uses: ./.github/actions/upgrade
        if: steps.changed-files.outputs.any_changed == 'true'

  finish-e2e:
    name: Confirm finishing all tests
    runs-on: ubuntu-22.04
    needs:
    - dbtest
    - e2e
    - e2e-mysql
    - upgrade
    steps:
      - run: echo "OK"
